<!DOCTYPE html>
<html lang="en">
    <title>CSS VARIABLES</title>
<head>
  <style>
    :root{
      --spacing: 20px;
      --blur: 0px;
      --base: #ffc600;
    }

   

    body{
  background: green;
  margin: 0;
  color: white;
  font-family: Arial;

  overflow: hidden;
}

h2{
  text-align: center;
  font-size: 48px;
  margin-top: 40px;
  color: var(--base);
}

.main{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 60px;
}

.controls{
  display: flex;
  gap: 30px;
  align-items: center;
}

.controls label{
  font-size: 25px;
  color: var(--base);
}



img{
  width: 300px;
  padding: var(--spacing);
  filter: blur(var(--blur));
  background: var(--base);
}


  </style>
</head>

<body>



<h2>Css variables</h2>

<div class="main">

  <div class="controls">
    <div>
      <label>spacing:</label>
      <input type="range" id="spacing" name="spacing" min="10" max="200" value="20" data-abc="px">
    </div>

    <div>
      <label>blur:</label>
      <input type="range" id="blur" name="blur" min="0" max="20" value="0" data-abc="px">
    </div>

    <div>
      <label>base color:</label>
      <input type="color" id="base" name="base" value="#ffc600" data-abc="px">
    </div>
  </div>

  <img src="images.jpg" alt="image">

</div>


<script>
  const spacingInp = document.querySelector('#spacing');
  const blurInp = document.querySelector('#blur');
  const colorInp = document.querySelector('#base');

  spacingInp.addEventListener('change', handleSpacing);
 
  function handleSpacing(){
    const unit = this.dataset.abc || '';
      document.documentElement.style.setProperty(`--${this.name}`, this.value + unit);
  }

  blurInp.addEventListener('change', handleBlur);
  
 function handleBlur(){
    const unit = this.dataset.abc || '';
      document.documentElement.style .setProperty(`--${this.name}`, this.value + unit);
  }

  colorInp.addEventListener('change', handleColor);

  function handleColor(){
   const unit = this.dataset.abc || '';
       document.documentElement.style.setProperty(`--${this.name}`, this.value);
  }
</script>

</body>
</html>
