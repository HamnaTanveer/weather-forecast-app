<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Counter App</title>

<style>
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#a18cd1,#fbc2eb);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* Card */
.counter-box{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

/* Number */
#count{
    font-size:60px;
    margin:25px 0;
    font-weight:bold;
}

/* Buttons */
.buttons{
    display:flex;
    gap:15px;
    justify-content:center;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    color:white;
}

/* Different colors */
.increase{
    background:#4CAF50;
}

.decrease{
    background:#f44336;
}

.reset{
    background:#555;
}

button:hover{
    opacity:0.8;
}
</style>
</head>

<body>

<div class="counter-box">
    <h2>Counter App</h2>
    <div id="count">0</div>

    <div class="buttons">
        <button class="decrease" id="dec">Decrease</button>
        <button class="reset" id="reset">Reset</button>
        <button class="increase" id="inc">Increase</button>
    </div>
</div>

<script>
const countEl = document.getElementById("count");
const incBtn = document.getElementById("inc");
const decBtn = document.getElementById("dec");
const resetBtn = document.getElementById("reset");

let count = 0;

/* Increase */
incBtn.addEventListener("click", () => {
    count++;
    countEl.innerText = count;
});

/* Decrease */
decBtn.addEventListener("click", () => {
    count--;
    countEl.innerText = count;
});

/* Reset */
resetBtn.addEventListener("click", () => {
    count = 0;
    countEl.innerText = count;
});
</script>

</body>
</html>
