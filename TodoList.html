<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TO DO APP</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: #175c8f;
    display:flex; 
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:800px;     
    max-width:95%;
    background:#5e7589;
    padding:15px;     
    border-radius:12px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:white;
}

.top-bar{
    background:#175c8f;
    padding:15px;
    border-radius:6px;
    display:flex;
    gap:15px;
    align-items:center;
}

#todo-input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:5px;
    font-size:16px;
    outline:none;
    color:white;
    background: #5e7589; 
}
#todo-input::placeholder{
    color: #dcdcdc;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.clearBtn,.addBtn{
    background:#5e7589;
    color:white;
}

.list-box{
    margin-top:20px;
    background:#175c8f;
    height:320px;
    border-radius:6px;
    padding:20px;
    overflow-y:scroll;
    margin:20px auto 0 auto;
}

#todo-list{
    list-style:none;
    padding:0;
    margin:0;
}

#todo-list li{
    background:#5e7589;
    padding: 12px;
    border-radius:5px;
    display:flex;
    align-items:center;
    margin-bottom:10px;
    color: white;
    justify-content: space-between;
}


#todo-list button {
    background: #175c8f;
    color: white;
     padding: 5px 10px;;
    border: none;
    border-radius: 4px;
    margin-left: 10px;
    cursor: pointer;
}
#todo-list li .edit {
    margin-left: auto;   
}




</style>
</head>

<body>
<div class="container">
    <h1>To Do List App</h1>

    <div class="top-bar">
        <button class="clearBtn" id="clearBtn">Clear Storage</button>
        <input type="text" id="todo-input" placeholder="Add or Update Your List">
        <button class="addBtn" id="addBtn">Add</button> 
    </div>

    <div class="list-box">
        <ul id="todo-list"></ul>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

const input = document.getElementById("todo-input");
const addBtn = document.getElementById("addBtn");
const clearBtn = document.getElementById("clearBtn");
const list = document.getElementById("todo-list");

let editIndex = null;

loadTodos();

// ADD BUTTON
addBtn.addEventListener("click", function(){

const taskText = input.value.trim();

if(taskText === ""){
alert("Please enter a task");
return;
}

let todos = JSON.parse(localStorage.getItem("todos")) || [];

if(editIndex !== null){

todos[editIndex] = taskText;
editIndex = null;
addBtn.innerText = "Add";

}else{

todos.push(taskText);

}

localStorage.setItem("todos", JSON.stringify(todos));

input.value = "";

loadTodos();

});


// CLEAR STORAGE
clearBtn.addEventListener("click", function(){
localStorage.removeItem("todos");
loadTodos();
});


// LOAD TODOS
function loadTodos(){

list.innerHTML = "";

const todos = JSON.parse(localStorage.getItem("todos")) || [];

todos.forEach(function(task,index){

createTodoElement(task,index);

});

}


// CREATE ELEMENT
function createTodoElement(text,index){

const li = document.createElement("li");

const span = document.createElement("span");
span.innerText = text;

const editBtn = document.createElement("button");
editBtn.innerText = "Edit";

const deleteBtn = document.createElement("button");
deleteBtn.innerText = "Delete";

li.appendChild(span);
li.appendChild(editBtn);
li.appendChild(deleteBtn);

list.appendChild(li);


// EDIT
editBtn.addEventListener("click", function(){

input.value = text;
editIndex = index;
addBtn.innerText = "Update";

});


// DELETE
deleteBtn.addEventListener("click", function(){

let todos = JSON.parse(localStorage.getItem("todos")) || [];

todos.splice(index,1);

localStorage.setItem("todos", JSON.stringify(todos));

loadTodos();

});

}

});
    
   
</script>
</body>
</html>
