<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticky Notes Apppractice</title>
<link rel="preconnect" href="https://fonts.gstatic.com">

    <link href="https://fonts.googleapis.com/css2?family=KoHo:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap"
        rel="stylesheet">
<style>
    body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}



.navbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#6fa8dc;
padding:15px 40px;
color:white;
}

.navbar ul{
display:flex;
list-style:none;
gap:25px;
}

/* Input */

.inputBox{
text-align:center;
padding:30px;
background:black;
}

.inputBox input{
width:400px;
padding:10px;
}

.inputBox button{
padding:10px 20px;
}



#notesContainer{
display:flex;
flex-wrap:wrap;
gap:40px;
padding:40px 60px;   /* upar se niche aur left se space */
margin-top:20px;     /* input box se distance */
}



   
.note{
width:180px;
min-height:200px;
background:#ffd966;
padding:40px 20px 20px 20px;
box-shadow:0 5px 10px rgba(0,0,0,0.3);
position:relative;
}

.note h3{
text-align:center;
margin:5px 0;
font-family: 'KoHo', sans-serif;
margin-top: 50px;
font-weight: bold;
}

.icons-container{
position:absolute;
top:0;
left:0;
width:100%;                  /* note ke hisab se adjust */
height:30px;
background:grey;
display:flex;
justify-content:flex-end;
align-items:center;
gap:5px;
padding-right:5px;
box-sizing:border-box;
}

.icons-container i{
color:white;
cursor:pointer;
font-size:16px;
}

.note .time {
    position: absolute;
    top: 5px;
    right: 10px;
    font-size: 12px;
    color: #555;
}

.note .date {
    position: absolute;
    bottom: 5px;
    right: 10px;
    font-size: 12px;
    color: #555;
}


</style>
</head>

<body>

<nav class="navbar">
<h2>Sticky Notes App</h2>

<ul>
<li>Home</li>
<li>About</li>
<li>Portfolio</li>
<li>Services</li>
<li>Contact Us</li>
</ul>
</nav>

<div class="inputBox">
<input type="text" id="noteInput" placeholder="Add Your Notes">
<button class="addBtn" id="addBtn">Add</button>
</div>

<div id="notesContainer"></div>

<div class="note">
    <div class="icons-container">...</div>
    <h3>Sticky Notes</h3>
    <p>note text</p>
    <div class="time">12:34:56</div>
    <div class="date">Monday, 7 March, 2026</div>
</div>

<script>



       

  document.addEventListener("DOMContentLoaded", function(){

    const addBtn = document.getElementById("addBtn");
    const noteInput = document.getElementById("noteInput");
    const notesContainer = document.getElementById("notesContainer");

    let notes = JSON.parse(localStorage.getItem("notes")) || [];
    let selectorIndex = null; // track which note is being edited

    loadNotes();

    // Add or Update note
    addBtn.addEventListener("click", function(){
        const text = noteInput.value.trim();
        if(text === ""){
            alert("Please enter a note!");
            return;
        }

        if(selectorIndex != null){
            // Update existing note
            notes[selectorIndex] = text;
            alert("Note Updated Successfully");
        } else {
            // Add new note
            notes.push(text);
            alert("Note Added Successfully");
        }

        localStorage.setItem("notes", JSON.stringify(notes));
        selectorIndex = null;
        addBtn.innerText = "Add";
        noteInput.value = "";
        loadNotes();
    });

    // Load all notes
    function loadNotes(){
        notesContainer.innerHTML = "";

        notes.forEach(function(noteText, index){
            createNoteItem(noteText, index);
        });
    }

    // Create individual note
    function createNoteItem(text, index){
        const note = document.createElement("div");
        note.className = "note";

        const iconsContainer = document.createElement("div");
        iconsContainer.className = "icons-container";

        const editIcon = document.createElement("i");
        editIcon.className = "fa-solid fa-pen-to-square edit";
        editIcon.title = "Edit Note";

        const deleteIcon = document.createElement("i");
        deleteIcon.className = "fa-solid fa-trash delete";
        deleteIcon.title = "Delete Note";

        iconsContainer.appendChild(editIcon);
        iconsContainer.appendChild(deleteIcon);

        const heading = document.createElement("h3");
        heading.innerText = "Sticky Notes";

        const para = document.createElement("p");
        para.innerText = text;


    // **Time div (top-right)**
    const timeDiv = document.createElement("div");
    timeDiv.className = "time";
    note.appendChild(timeDiv);
function updateTime() {
        timeDiv.innerText = displayTime();
    }
    updateTime(); // initial call
    setInterval(updateTime, 1000); // update every second

    // **Date div (bottom-right)**
    const dateDiv = document.createElement("div");
    dateDiv.className = "date";
    dateDiv.innerText = displayDate();
    note.appendChild(dateDiv);


        note.appendChild(iconsContainer);
        note.appendChild(heading);
        note.appendChild(para);
        notesContainer.appendChild(note);

        // Edit functionality - Todo-style
        editIcon.addEventListener("click", function(){
            noteInput.value = text;       // show note text in input
            addBtn.innerText = "Update";  // change button text
            selectorIndex = index;        // mark which note to update
        });

        // Delete functionality - filter
        deleteIcon.addEventListener("click", function(){
            notes = notes.filter(function(_, i){
                return i !== index;
            });
            localStorage.setItem("notes", JSON.stringify(notes));
            loadNotes();
        });
    }
});







</script>

</body> 
</html>
