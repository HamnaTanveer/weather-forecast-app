<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Piano</title>

    <style>
        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
             overflow: hidden;
        }

        .keys {
            display: flex;
            gap: 20px;
        }

        .key {
            width: 110px;
            height: 110px;
            background: linear-gradient(to bottom, #6e6e6e, #4f4f4f);
            border-radius: 10px;
            border: 6px solid grey;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.5s ease;
            color: white;
        }

        .key.playing {
            transform: rotate(45deg) scale(1.1);
            border-color: #ffc600;
            box-shadow: 0 0 1rem #ffc600,
            0 8px 15px rgba(0, 0, 0, 0.3);
        }

        kbd {
            font-size: 30px;
            text-shadow: 0 0 0.5rem #000;
        }

        .sound {
            font-size: 15px;
            color: #ffc600;
            margin-top: 5px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="keys">

        <div class="key" data-key="65"><kbd>A</kbd><span class="sound">CLAP</span> </div>
        <div class="key" data-key="83"><kbd>S</kbd><span class="sound">HIHAT</span></div>
        <div class="key" data-key="68"> <kbd>D</kbd><span class="sound">KICK</span></div>
        <div class="key" data-key="70">  <kbd>F</kbd>  <span class="sound">OPENHAT</span> </div>
        <div class="key" data-key="71"><kbd>G</kbd><span class="sound">BOOM</span> </div>
        <div class="key" data-key="72"> <kbd>H</kbd><span class="sound">RIDE</span> </div>
        <div class="key" data-key="74"><kbd>J</kbd><span class="sound">SNARE</span></div>
        <div class="key" data-key="75"> <kbd>K</kbd>  <span class="sound">TOM</span> </div>
        <div class="key" data-key="76"><kbd>L</kbd><span class="sound">TINK</span></div>
           
            
       

    </div>


    <audio data-key="65" src="clap.wav"></audio>
    <audio data-key="83" src="hihat.wav"></audio>
    <audio data-key="68" src="tink.wav"></audio>
    <audio data-key="70" src="openhat.wav"></audio>
    <audio data-key="71" src="boom.wav"></audio>
    <audio data-key="72" src="ride.wav"></audio>
    <audio data-key="74" src="snare.wav"></audio>
    <audio data-key="75" src="tom.wav"></audio>
    <audio data-key="76" src="tink.wav"></audio>

    <script>
        const keys = document.querySelectorAll(".key");

        window.addEventListener("keydown", (event) => {
            console.log('A key was pressed:', event);

            const audio = document.querySelector(`audio[data-key="${event.keyCode}"]`);
            const key = document.querySelector(`.key[data-key="${event.keyCode}"]`);

            if (audio){
                audio.currentTime = 0;
                audio.play();
            }

            if (key){
                key.classList.add("playing");
            }

        });


        window.addEventListener("keyup", (event) => {
        const key = document.querySelector(`.key[data-key="${event.keyCode}"]`);

            if (key){
                key.classList.remove("playing");
            }

        });
    </script>

</body>

</html>
